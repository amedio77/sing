<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="실제 곡 시간에 맞춰 흐르는 가사 프롬프터" />
    <title>가사 프롬프터 · 노래 연습</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8E%A4%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="karaoke.css" />
  </head>
  <body class="prompter">
    <header class="appbar">
      <a class="iconbtn" href="study.html" title="암기 화면으로">← 암기</a>
      <h1 id="title">가사 프롬프터</h1>
      <a class="iconbtn" id="sync-link" href="sync.html" title="타임라인 보정">⏱</a>
      <button class="iconbtn" id="player-toggle" aria-label="플레이어 접기">🎬</button>
      <button class="iconbtn" id="fs" aria-label="전체화면">⛶</button>
    </header>

    <nav class="songtabs" id="songtabs" role="tablist" aria-label="곡 선택"></nav>

    <main class="wrap">
      <p class="notice" id="notice" role="status" aria-live="polite"></p>

      <div class="urlrow" id="urlrow">
        <input
          id="url"
          type="url"
          inputmode="url"
          placeholder="YouTube 주소를 붙여넣으면 실제 음원에 맞춰 흐릅니다"
          aria-label="YouTube 주소"
        />
        <button class="btn" id="url-save">저장</button>
        <button class="btn" id="url-search" title="YouTube에서 이 곡 검색">검색</button>
      </div>

      <div class="player-wrap hidden" id="player-wrap"><div id="player"></div></div>

      <div class="meta" id="meta"></div>

      <section class="stage" aria-label="가사">
        <div class="rail" id="rail"></div>
        <div class="countin" id="countin"><b id="countin-num">0</b><span>첫 소절까지</span></div>
      </section>

      <div class="controls">
        <button class="btn primary" id="play" style="min-width: 96px">▶ 재생</button>
        <button class="iconbtn" id="skip-intro" aria-label="첫 소절부터 바로 시작" title="인트로를 건너뛰고 첫 소절부터">
          ⏭ 바로 시작
        </button>
        <button class="iconbtn" id="prev-line" aria-label="이전 줄">◀ 줄</button>
        <button class="iconbtn" id="next-line" aria-label="다음 줄">줄 ▶</button>
        <button class="iconbtn" id="restart" aria-label="처음으로">↺</button>
        <span class="clock" id="clock">0:00 / 0:00</span>
        <span class="offset">
          <span class="ctrl-label">오프셋</span>
          <button id="off-m5" aria-label="0.5초 앞으로">−0.5</button>
          <button id="off-m1" aria-label="0.1초 앞으로">−0.1</button>
          <output id="off-val">0.0s</output>
          <button id="off-p1" aria-label="0.1초 뒤로">+0.1</button>
          <button id="off-p5" aria-label="0.5초 뒤로">+0.5</button>
        </span>
      </div>

      <p class="hint">
        스페이스 = 재생/일시정지 · S = 바로 시작 · ← → = 오프셋 ∓0.1초 · ↑ ↓ = 줄 이동 · F = 전체화면 ·
        1~4 = 곡 선택
      </p>
    </main>

    <noscript>이 페이지는 JavaScript가 필요합니다.</noscript>
    <script type="module" src="prompter.js"></script>
  </body>
</html>
